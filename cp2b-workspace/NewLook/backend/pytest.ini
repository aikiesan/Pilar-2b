[pytest]
# Pytest configuration for CP2B Maps V3 Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths — unit/, integration/ and compliance/ are stable; root-level and
# api/ have pre-existing failures from superseded Supabase/async patterns.
# compliance/ added 2026-07-09: it was left out of the default run, so the 20
# LGPD/security-header guardrail tests never executed in CI.
testpaths = tests/unit tests/integration tests/compliance

# Add app directory to Python path
pythonpath = .

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-branch
    --cov-fail-under=40
    --ignore=tests/integration/endpoints/test_analysis.py
    --ignore=tests/integration/endpoints/test_codigestion_endpoint.py
    --ignore=tests/integration/endpoints/test_geospatial.py
    --ignore=tests/integration/endpoints/test_municipalities.py

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    slow: Slow running tests
    database: Tests that require database connection
    auth: Authentication related tests
    asyncio: Async test functions

# Async test support
asyncio_mode = auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod