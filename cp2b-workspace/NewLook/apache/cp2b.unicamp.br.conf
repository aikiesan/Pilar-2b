<VirtualHost *:80>
    ServerName cp2b.unicamp.br
    ServerAlias www.cp2b.unicamp.br
    ServerAdmin nipeinfo@unicamp.br

    DocumentRoot /var/www/cp2b/repo/cp2b_web/dist

    ProxyPreserveHost On

    # ── PILAR-2b API ──────────────────────────────────────────────────
    ProxyPass /pilar2b/api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /pilar2b/api/ http://127.0.0.1:8001/api/

    # ── PILAR-2b static chunks (_next) ───────────────────────────────
    ProxyPass /pilar2b/_next !
    Alias /pilar2b/_next /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next
    <Directory /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # ── PILAR-2b public assets (imagens sem basePath) ─────────────────
    ProxyPass /screenshots !
    ProxyPass /images !
    ProxyPass /icons !
    Alias /screenshots /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public/screenshots
    Alias /images /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public/images
    Alias /icons /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public/icons
    <Directory /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ── PILAR-2b SSR ──────────────────────────────────────────────────
    ProxyPass /pilar2b http://localhost:3001/pilar2b
    ProxyPassReverse /pilar2b http://localhost:3001/pilar2b

    # ── cp2b main site (SPA) ─────────────────────────────────────────
    <Directory /var/www/cp2b/repo/cp2b_web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_URI} !^/pilar2b
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    RewriteEngine On
    RewriteRule ^/pilar2b$ /pilar2b/pt-BR [R=302,L]

    ProxyPass /api/ http://localhost:3000/
    ProxyPassReverse /api/ http://localhost:3000/

    Alias /uploads /var/www/cp2b/repo/cp2b_web/backend/uploads
    <Directory /var/www/cp2b/repo/cp2b_web/backend/uploads>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cp2b-error.log
    CustomLog ${APACHE_LOG_DIR}/cp2b-access.log combined
</VirtualHost>
