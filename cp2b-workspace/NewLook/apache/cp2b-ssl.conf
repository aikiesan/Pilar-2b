<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cp2b.unicamp.br
    ServerAlias www.cp2b.unicamp.br
    ServerAdmin noc@unicamp.br
    DocumentRoot /var/www/cp2b/repo/cp2b_web/dist
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/cp2b.unicamp.br.pem
    SSLCertificateKeyFile /etc/ssl/private/cp2b_unicamp_br.key

    # ── PILAR-2b proxy rules MUST come before DocumentRoot rewrite ────
    ProxyPreserveHost On

    ProxyPass /pilar2b/api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /pilar2b/api/ http://127.0.0.1:8001/api/

    Alias /pilar2b/_next /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next
    <Directory /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ProxyPass /pilar2b http://127.0.0.1:3001/pilar2b
    ProxyPassReverse /pilar2b http://127.0.0.1:3001/pilar2b

    ProxyPass /api http://localhost:3001/api
    ProxyPassReverse /api http://localhost:3001/api

    # ── cp2b main site (static files) ────────────────────────────────
    <Directory /var/www/cp2b/repo/cp2b_web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteRule ^\.well-known/ - [L]
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    Alias /uploads /var/www/cp2b/repo/cp2b_web/backend/uploads
    <Directory /var/www/cp2b/repo/cp2b_web/backend/uploads>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cp2b-error.log
    CustomLog ${APACHE_LOG_DIR}/cp2b-access.log combined

    <Location /admin>
        AuthType Basic
        AuthName "CP2B Admin - Acesso Restrito"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Location>
</VirtualHost>
</IfModule>
