# Apache VirtualHost for pilar2b.cp2b.unicamp.br
#
# SSL is terminated at Unicamp's edge infrastructure — this VM only receives
# plain HTTP on port 80. The RequestHeader lines below tell Next.js and FastAPI
# that the original request arrived over HTTPS so redirects and cookies work.
#
# Install:
#   sudo cp apache/pilar2b.conf /etc/apache2/sites-available/
#   sudo a2enmod alias headers proxy proxy_http rewrite
#   sudo a2ensite pilar2b.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Required Apache modules (check with: sudo apache2ctl -M):
#   alias_module, proxy_module, proxy_http_module, rewrite_module, headers_module

<VirtualHost *:80>
    ServerName  pilar2b.cp2b.unicamp.br
    ServerAdmin noc@unicamp.br

    # Inform upstream services that the original request was HTTPS
    # (SSL terminated at Unicamp edge before reaching this VM)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPreserveHost On

    # ── FastAPI backend (/api/*) ──────────────────────────────────────────────
    # uvicorn listening on 127.0.0.1:8001 (managed by PM2 as pilar-backend)
    ProxyPass        /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    # ── Next.js static chunks — served directly by Apache (no proxy overhead) ─
    # basePath is /pilar2b, so the browser requests /pilar2b/_next/static/...
    # Content-hashed filenames: safe to cache forever.
    Alias /pilar2b/_next/static/ /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next/static/
    <Directory /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next/static/>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # ── Public assets (images, screenshots, icons, etc.) ─────────────────────
    Alias /pilar2b/ /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public/
    <Directory /var/www/pilar2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/public/>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # ── Next.js frontend (SSR pages and API routes) ───────────────────────────
    # node .next/standalone/server.js listening on 127.0.0.1:3002 (PM2: pilar-frontend)
    # The Alias rules above take precedence for static/_next paths; everything
    # else (locale routes, dashboard, etc.) falls through to Node.
    ProxyPass        /pilar2b/ http://127.0.0.1:3002/pilar2b/
    ProxyPassReverse /pilar2b/ http://127.0.0.1:3002/pilar2b/

    ErrorLog  ${APACHE_LOG_DIR}/pilar2b-error.log
    CustomLog ${APACHE_LOG_DIR}/pilar2b-access.log combined
</VirtualHost>
