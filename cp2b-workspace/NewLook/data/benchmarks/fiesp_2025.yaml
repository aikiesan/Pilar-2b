provenance_caveats:
  - >
    Os rendimentos por tonelada da Tabela 5 remetem majoritariamente a
    "CH4 SOLUTIONS, 2020 — Documentos internos", relatório proprietário sem URL
    nem DOI. Não são verificáveis de forma independente.
  - >
    Nenhum DOI acadêmico sustenta os fatores centrais de oferta da FIESP; eles
    repousam em CH4 SOLUTIONS 2020 (interno) e IPCC 2006.
  - >
    O relatório em si não tem URL versionada neste repositório. O campo
    `document.url` está deliberadamente nulo em vez de preenchido por suposição.
