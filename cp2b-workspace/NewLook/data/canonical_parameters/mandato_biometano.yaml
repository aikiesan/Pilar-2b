# =============================================================================
# PILAR-2b: painel do mandato do biometano (Estratégia 2027, C26)
# =============================================================================
# Lei 14.993/2024 (Combustível do Futuro): produtores e importadores de gás
# natural reduzem as emissões do gás que vendem numa meta anual, cumprida com
# biometano e comprovada com CGOB. A lei começa em 1 % e limita a 10 %; o CNPE
# fixa a meta de cada ano.
#
# Produção mensal: anp_biometano_producao_uf_mensal.csv, cópia de
# analysis/data/05d_* escrita por analysis/build_anp_biometano_dataset.py.
# Motor: backend/app/services/mandate_service.py.
#
# status de cada meta:
#   vigente     — fixada em resolução do CNPE
#   proposta    — em consulta pública; pode mudar
#   indicativa  — trajetória sem volume publicado; o volume é o da proposta
#                 mais recente, proporcional ao percentual (só ordem de grandeza)
# =============================================================================

versao: "2026-10-19"

# 3.632.492 CGOB para 363.249.200 m³ (Portaria MME 942/2026).
m3_por_cgob: 100

metas:
  # Volumes como publicados; em 2026 o anual dividido pelo diário dá 360 dias,
  # e o painel usa o diário.
  - ano: 2026
    reducao_pct: 0.5
    volume_m3_ano: 181728000
    volume_m3_dia: 504800
    status: vigente
    ato: "Resolução CNPE nº 4/2026"
    fonte: "https://www.gov.br/mme/pt-br/assuntos/conselhos-e-comites/cnpe/resolucoes-do-cnpe/2026/resolucao-4-publicada.pdf"
  - ano: 2027
    reducao_pct: 1.0
    volume_m3_ano: 363249200
    volume_m3_dia: 995200
    status: proposta
    ato: "Portaria MME nº 942/2026 (consulta pública até 06/11/2026)"
    fonte: "https://www.gov.br/mme/pt-br/acesso-a-informacao/legislacao/portarias/2026/portaria-mme-n-942-2026.pdf"
  - ano: 2028
    reducao_pct: 3.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: "https://cenarioenergia.com.br/2026/10/06/mme-consulta-publica-meta-reducao-emissoes-gas-natural-2027/"
  - ano: 2029
    reducao_pct: 4.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: "https://cenarioenergia.com.br/2026/10/06/mme-consulta-publica-meta-reducao-emissoes-gas-natural-2027/"
  - ano: 2030
    reducao_pct: 5.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: "https://cenarioenergia.com.br/2026/10/06/mme-consulta-publica-meta-reducao-emissoes-gas-natural-2027/"

producao:
  arquivo: anp_biometano_producao_uf_mensal.csv
  fonte: "ANP, dados abertos: produção de biometano por UF (via analysis/build_anp_biometano_dataset.py)"

cgob:
  registro_publico: false
  nota: "Ainda não há registro público de CGOB emitidos; o painel mostra a emissão quando ele existir."

# -----------------------------------------------------------------------------
# Troca de rota (C17): por Nm³ de CH₄, quando vender biometano paga mais que
# queimar o biogás para gerar eletricidade?
#
#   rota elétrica    CH₄ × PCI × rendimento elétrico × preço da eletricidade
#   rota biometano   molécula + atributo ambiental (CGOB ou equivalente) − purificação
#
# O painel mostra o ATRIBUTO DE EQUILÍBRIO: quanto o atributo precisa valer
# para as duas rotas pagarem o mesmo, a cada preço de eletricidade. Preços de
# triagem com fonte; trocar por dado de contrato antes de citar. PCI e
# rendimento são os do script de cenários (backend/scripts/sp_scenarios_real_ideal.py);
# um teste confere que os dois arquivos concordam, assim como o biogás de SP
# (analysis/data/05b_*).
# -----------------------------------------------------------------------------
troca_de_rota:
  pci_ch4_kwh_m3: 9.94
  rendimento_eletrico: 0.38
  molecula_brl_m3: 2.25
  atributo_referencia_brl_m3: 1.40
  fonte_molecula_atributo: "Tarifa do Mercado Cativo Verde Arsesp/Comgás (set/2026), fonte única de imprensa; conferir na deliberação da Arsesp"
  url_molecula_atributo: "https://diariodotransporte.com.br/2026/09/10/bombeiros-de-sao-paulo-abrem-consulta-publica-para-revisar-instrucao-de-comercializacao-distribuicao-utilizacao-e-producao-de-gas-natural-e-biometano/"
  purificacao_eur_mwh: 19.0
  brl_por_eur: 6.3
  fonte_purificacao: "Referência europeia de CAPEX + OPEX para uma unidade de 250 m³/h; conferir com dado brasileiro"
  # R$/MWh. pld: médias diárias do PLD SE/CO na CCEE, abr–jul/2026.
  # autoconsumo: valor próximo da tarifa que a usina deixa de pagar quando
  # usa a própria energia (suposto).
  precos_eletricidade:
    - chave: pld_baixo
      brl_mwh: 185
    - chave: pld_medio
      brl_mwh: 250
    - chave: pld_alto
      brl_mwh: 300
    - chave: autoconsumo
      brl_mwh: 450
  fonte_eletricidade: "CCEE, InfoPLD diário (SE/CO, abr–jul/2026); autoconsumo suposto"
  url_eletricidade: "https://www.ccee.org.br/documents/80415/35629354/InfoPLD_Diario30072026.pdf/1a4ac8d1-b541-e513-63ba-a066190ca457"
  # Biogás que SP já produz, quase todo queimado para eletricidade.
  biogas_sp_m3_dia: 4900000
  fracao_ch4: [0.55, 0.65]
  fonte_biogas_sp: "CIBiogás, Panorama do Biogás 2025"

# -----------------------------------------------------------------------------
# Pilha de receitas (C27): o que soma na receita de um m³ de biometano e o que
# se exclui. Molécula, atributo, PCI e fração de CH₄ vêm de `troca_de_rota`;
# aqui ficam só o que é próprio da pilha. Valores de triagem: conferir antes
# de citar.
# -----------------------------------------------------------------------------
pilha_de_receitas:
  # Teto do CBIO: a nota de eficiência não passa da intensidade do fóssil de
  # referência (biometano com intensidade zero). 1 CBIO = 1 t CO₂e.
  fossil_referencia_g_co2e_mj: 86.7
  fonte_fossil_referencia: "RenovaCalc, aba biometano, citada pelo CIBiogás na CP 10/2018 da ANP; conferir na versão vigente"
  url_fossil_referencia: "https://www.gov.br/anp/pt-br/assuntos/consultas-e-audiencias-publicas/consulta-audiencia-publica/2018/arquivos-consultas-e-audiencias-publicas-2018/cap-10-2018/cibiogas-comentarios-sugestoes.pdf"
  precos_cbio:
    - chave: jan_fev_2026
      brl: 31.40
    - chave: media_2025
      brl: 54.70
  fonte_cbio: "Itaú BBA, relatório RenovaBio (início de 2026); conferir na série da B3"
  url_cbio: "https://novidadesmt.com.br/agronegocio/renovabio-inicia-2026-com-metas-menores-e-precos-de-cbios-em-queda-aponta-relatorio-do-itau-bba/"
  # CBIO e CGOB da mesma nota fiscal: permitido, com o CGOB indicando o CBIO
  # (Resolução ANP 996/2026); lastro retroativo de 2026 exige cancelar o
  # certificado voluntário do mesmo volume.
  fonte_regra_cgob: "Resolução ANP 996/2026, resumo de Tauil & Chequer (mar/2026); conferir no texto da resolução"
  url_regra_cgob: "https://www.tauilchequer.com.br/pt/insights/publications/2026/03/anp-issues-rules-on-biomethane-targets-and-cgob-issuance"
  url_critica_cgob_cbio: "https://brasilenergia.com.br/energia/certificado-de-garantia-de-origem-de-biometano-um-fim-em-si-mesmo"
  url_mercado_cativo_verde: "https://agenciainfra.com/blog/comgas-obtem-aval-para-vender-biometano-no-mercado-cativo-verde/"
  densidade_co2_kg_m3: 1.977
  # Parte do valor dos nutrientes do digestato de SP por destino atual do
  # resíduo (analysis/build_sp_digestate_nutrients.py, cenário Real); um teste
  # da raiz confere contra o protótipo.
  digestato_valor_por_destino:
    ja_reciclado: 0.81
    reposicao: 0.13
    novo: 0.06

# -----------------------------------------------------------------------------
# CO₂ biogênico (C20): o CO₂ que a purificação separa, por planta de SP, e o
# tamanho do mercado onde ele seria vendido. Fração de CH₄ e biogás de SP vêm
# de `troca_de_rota`; densidade do CO₂, de `pilha_de_receitas`. Valores de
# mercado de fonte única: conferir antes de citar.
# -----------------------------------------------------------------------------
co2_biogenico:
  # Retrato do último mês por planta (capacidade e biogás processado), cópia de
  # analysis/data/05c_* escrita por analysis/build_anp_biometano_dataset.py.
  plantas:
    arquivo: anp_biometano_plantas_ultimo_mes.csv
    fonte: "ANP, dados abertos: capacidade e biogás processado por planta (via analysis/build_anp_biometano_dataset.py)"
  # Consumo brasileiro de CO₂ (todo o mercado industrial) e a unidade de CO₂ da
  # usina Cocal (fermentação), declarados pelo diretor da Air and Parts.
  mercado_brasil_t_dia: 1600
  unidade_cocal_t_dia: 48
  fonte_mercado: "Air and Parts (diretor), AgFeed, out/2023; fonte única"
  url_mercado: "https://agfeed.com.br/negocios/depois-do-biometano-venda-de-co2-da-mais-um-gas-a-usinas-de-etanol"
  # CO₂ biogênico disponível no Brasil, estudo da EPE.
  etanol_mt_ano: 27
  biogas_kt_ano: 491
  biogas_operando_kt_ano: 99
  fonte_epe: "EPE, estudo de CO₂ biogênico, resumido pela eixos; conferir no caderno da EPE"
  url_epe: "https://eixos.com.br/newsletters/dialogos-da-transicao/na-corrida-pelos-biocombustiveis-co2-vira-produto/"
  url_sbce: "https://www2.camara.leg.br/legin/fed/lei/2024/lei-15042-11-dezembro-2024-796690-publicacaooriginal-173745-pl.html"
