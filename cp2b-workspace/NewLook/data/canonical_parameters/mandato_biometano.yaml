# =============================================================================
# PILAR-2b: painel do mandato do biometano (Estratégia 2027, C26)
# =============================================================================
# Lei 14.993/2024 (Combustível do Futuro), art. 17: produtores e importadores de
# gás natural reduzem as emissões do gás que vendem numa meta anual, cumprida
# com biometano e comprovada com CGOB. A lei começa em 1 % e limita a 10 %; o
# CNPE fixa a meta de cada ano.
#
# Produção mensal: anp_biometano_producao_uf_mensal.csv, cópia de
# analysis/data/05d_* escrita por analysis/build_anp_biometano_dataset.py.
# Motor: backend/app/services/mandate_service.py.
#
# status de cada meta:
#   vigente     — fixada em resolução do CNPE
#   proposta    — em consulta pública; pode mudar
#   indicativa  — trajetória sem volume publicado; o volume é o da proposta
#                 mais recente, proporcional ao percentual (só ordem de grandeza)
#
# FONTES: todo número cita uma entrada de `fontes` (no fim do arquivo) pela
# chave. Cada entrada diz quem publicou, quando, o link e o tipo:
#   oficial     lei, resolução, portaria ou página de órgão público
#   dados       série pública que o usuário pode baixar e refazer a conta
#   estudo      relatório técnico ou artigo
#   empresa     página da própria empresa (o número é declaração dela)
#   imprensa    notícia ou resumo; conferir no original antes de citar
#   estimativa  suposição do PILAR-2b, sem fonte pública
# O registro da verificação, número a número, está em
# docs/qa/VERIFICACAO_FONTES_PAINEL_MANDATO.md.
# =============================================================================

versao: "2026-10-20"
fontes_verificadas_em: "2026-10-20"

# 3.632.492 CGOB para 363.249.200 m³ (Portaria MME 942/2026); 1 CGOB = 100 m³
# (Resolução ANP 995/2026).
m3_por_cgob: 100

# Fontes gerais do painel (lei, metas, regras do CGOB).
fontes_painel: [lei_14993, cnpe_4_2026, portaria_942, consulta_234, res_anp_995, res_anp_996]

metas:
  # Volumes como publicados. Em 2026 o anual dividido pelo diário dá 360 dias;
  # em 2027, 365. O painel usa o diário.
  - ano: 2026
    reducao_pct: 0.5
    volume_m3_ano: 181728000
    volume_m3_dia: 504800
    status: vigente
    ato: "Resolução CNPE nº 4/2026"
    fonte: cnpe_4_2026
  - ano: 2027
    reducao_pct: 1.0
    volume_m3_ano: 363249200
    volume_m3_dia: 995200
    status: proposta
    ato: "Portaria MME nº 942/2026 (consulta pública nº 234 até 06/11/2026)"
    fonte: portaria_942
  - ano: 2028
    reducao_pct: 3.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: portaria_942
  - ano: 2029
    reducao_pct: 4.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: portaria_942
  - ano: 2030
    reducao_pct: 5.0
    status: indicativa
    ato: "Portaria MME nº 942/2026"
    fonte: portaria_942

producao:
  arquivo: anp_biometano_producao_uf_mensal.csv
  fontes: [anp_painel_biometano]

cgob:
  registro_publico: false
  fontes: [res_anp_996, cgob_exame, cgob_b3]

# -----------------------------------------------------------------------------
# Troca de rota (C17): por m³ de CH₄, quando vender biometano paga mais que
# queimar o biogás para gerar eletricidade?
#
#   rota elétrica    CH₄ × PCI × rendimento elétrico × preço da eletricidade
#   rota biometano   molécula + atributo ambiental (CGOB ou equivalente) − purificação
#
# O painel mostra o ATRIBUTO DE EQUILÍBRIO: quanto o atributo precisa valer
# para as duas rotas pagarem o mesmo, a cada preço de eletricidade. PCI e
# rendimento são os do script de cenários (backend/scripts/sp_scenarios_real_ideal.py);
# um teste confere que os dois arquivos concordam, assim como o biogás de SP
# (analysis/data/05b_*).
# -----------------------------------------------------------------------------
troca_de_rota:
  # PCI do metano a 0 °C e 1 atm (NIST: 35,8 MJ/Nm³). Rendimento elétrico do
  # motor-gerador: suposição; motores grandes chegam a 40–45 %.
  pci_ch4_kwh_m3: 9.94
  rendimento_eletrico: 0.38
  # Molécula e atributo: o preço inicial do biometano no Mercado Cativo Verde
  # da Comgás, sem PIS/Cofins (Deliberação Arsesp 1.846/2026, art. 1º, IV:
  # R$ 2,250000/m³ e R$ 1,400000/m³; em vigor desde 10/09/2026). Com PIS/Cofins
  # (8,9 %), o gás do cativo verde custa R$ 4,009694/m³ (art. 1º, § 2º). O gás
  # natural dos segmentos não térmicos custa R$ 2,885935/m³ com PIS/Cofins, ou
  # R$ 2,63/m³ sem.
  molecula_brl_m3: 2.25
  # O CGOB ainda não tem preço: os fornecedores pedem piso de R$ 1/m³ e parte do
  # mercado espera menos (Argus, jan/2026).
  atributo_referencia_brl_m3: 1.40
  # Purificação: cerca de € 0,25 por m³ numa unidade de 250 m³/h (~€ 25/MWh);
  # cai abaixo de € 0,15 acima de 2.000 m³/h.
  purificacao_eur_mwh: 25.0
  # Euro PTAX: média de set/2026 ≈ 5,92; 16/10/2026 = 5,71.
  brl_por_eur: 5.8
  # R$/MWh. PLD SE/CO de abr–jul/2026 nos boletins da CCEE: 133 (jul, acoplado),
  # 177–206 (abr–jun), 222 (máximo diário encontrado, mai). Piso de 2026:
  # R$ 57,31; teto estrutural R$ 785,27.
  # autoconsumo: perto da tarifa que a usina deixa de pagar quando usa a
  # própria energia (suposto).
  precos_eletricidade:
    - chave: pld_baixo
      brl_mwh: 135
    - chave: pld_medio
      brl_mwh: 190
    - chave: pld_alto
      brl_mwh: 225
    - chave: autoconsumo
      brl_mwh: 450
  # Biogás que SP já produz (CIBiogás: ~4,9 milhões de Nm³/dia); no Brasil,
  # cerca de 62 % do biogás vai para eletricidade.
  biogas_sp_m3_dia: 4900000
  # CH₄ no biogás: 55–65 % (Embrapa dá 60–65 %; o limite inferior inclui aterro).
  fracao_ch4: [0.55, 0.65]
  fontes:
    molecula: [arsesp_1846, comgas_tarifas]
    atributo: [arsesp_1846, mercado_cativo_verde, argus_biometano_2026]
    purificacao: [purificacao_custos]
    cambio: [bcb_ptax]
    eletricidade: [ccee_painel_precos, ccee_pld_dados, ccee_infopld_jul2026]
    autoconsumo: [autoconsumo_suposto]
    pci: [nist_metano]
    rendimento: [rendimento_suposto, cat_cg170]
    fracao_ch4: [embrapa_reforma_biogas]
    biogas_sp: [cibiogas_panorama_2025]

# -----------------------------------------------------------------------------
# Pilha de receitas (C27): o que soma na receita de um m³ de biometano e o que
# se exclui. Molécula, atributo, PCI e fração de CH₄ vêm de `troca_de_rota`;
# aqui ficam só o que é próprio da pilha.
# -----------------------------------------------------------------------------
pilha_de_receitas:
  # Teto do CBIO: a nota de eficiência não passa da intensidade do fóssil de
  # referência do biometano na RenovaCalc (média ponderada de gasolina, diesel
  # e gás natural; biometano com intensidade zero). 1 CBIO = 1 t CO₂e evitada.
  fossil_referencia_g_co2e_mj: 86.7
  precos_cbio:
    - chave: jan_fev_2026
      brl: 31.40
    - chave: media_2025
      brl: 54.70
  # CBIO e CGOB da mesma nota fiscal: permitido, com o CGOB indicando o CBIO
  # (Resolução ANP 996/2026); lastro retroativo de 2026 exige cancelar o
  # certificado voluntário do mesmo volume.
  # CO₂ a 20 °C e 1 atm, a condição de referência dos m³ da ANP (1,977 kg/m³
  # seria a 0 °C).
  densidade_co2_kg_m3: 1.84
  # Parte do valor dos nutrientes do digestato de SP por destino atual do
  # resíduo (analysis/build_sp_digestate_nutrients.py, cenário Real); um teste
  # da raiz confere contra o protótipo.
  digestato_valor_por_destino:
    ja_reciclado: 0.81
    reposicao: 0.13
    novo: 0.06
  fontes:
    fossil: [renovacalc, renovacalc_pereira_2025]
    cbio: [anp_cbio, b3_icbio, cbio_itau_2026]
    unidade_cgob: [res_anp_995]
    regra_cgob: [res_anp_996, cgob_tauil]
    critica: [cgob_critica_abrace]
    densidade: [res_anp_906]
    digestato: [modelo_digestato]

# -----------------------------------------------------------------------------
# CO₂ biogênico (C20): o CO₂ que a purificação separa, por planta de SP, e o
# tamanho do mercado onde ele seria vendido. Fração de CH₄ e biogás de SP vêm
# de `troca_de_rota`; densidade do CO₂, de `pilha_de_receitas`.
# -----------------------------------------------------------------------------
co2_biogenico:
  # Retrato do último mês por planta (capacidade e biogás processado), cópia de
  # analysis/data/05c_* escrita por analysis/build_anp_biometano_dataset.py.
  plantas:
    arquivo: anp_biometano_plantas_ultimo_mes.csv
  # Consumo brasileiro de CO₂ (todo o mercado industrial): 1.600 t/dia segundo
  # a Air and Parts (2023); outra estimativa de imprensa (2022) dá 1.100.
  mercado_brasil_t_dia: 1600
  # Unidade da Cocal em Narandiba/SP: CO₂ da purificação do biogás, desde 2021.
  unidade_cocal_t_dia: 48
  # Caderno da EPE: CO₂ biogênico disponível. Biogás: 99 mil t/ano das plantas
  # de biometano em operação (base 2024) + 392 mil das que aguardam autorização.
  etanol_mt_ano: 27
  biogas_kt_ano: 491
  biogas_operando_kt_ano: 99
  fontes:
    plantas: [anp_painel_biometano]
    mercado: [mercado_co2_agfeed, mercado_co2_eixos_2022]
    exemplos: [cocal_co2, gasverde_co2]
    epe: [epe_caderno_co2, epe_co2_eixos]
    remocao: [lei_15042, lei_14993, decreto_13095, anp_ccs]

# Páginas vivas, onde o usuário confere os números mais recentes.
onde_conferir:
  - anp_painel_biometano
  - consulta_234
  - comgas_tarifas
  - ccee_painel_precos
  - b3_icbio
  - renovacalc
  - bcb_ptax

