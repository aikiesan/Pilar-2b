# =============================================================================
# PILAR-2b Canonical Feedstock Parameter Database
# =============================================================================
# VERSION: 1.0  |  DATE: 2026-06-04  |  PLATFORM: PILAR-2b / CP2b — NIPE UNICAMP
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for all biochemical parameters
# used in PILAR-2b. Do NOT edit SQL migrations, Python configs, or TypeScript
# constants directly — run scripts/generate_from_canonical.py instead.
#
# PARAMETER CONVENTIONS:
#   bmp        — Biochemical Methane Potential, NmL CH₄ / g VS
#                Measured on dry-weight VS basis (standard for BMP assays).
#   ts         — Total Solids, % of wet weight (field/industry measurement basis).
#   vs_of_ts   — Volatile Solids as % of Total Solids (dry-weight basis, lab basis).
#   vs_wet     — DERIVED: ts × vs_of_ts / 100  (% wet weight; used in service layer).
#   ch4_pct    — Methane content in produced biogas, % vol.
#   cn_ratio   — Carbon:Nitrogen mass ratio.
#
# LAYER MAPPING (done by the generator):
#   SQL residuos table  : bmp_min/medio/max, ts_min/medio/max, vs_min/medio/max (% of TS)
#   Python service       : bmp (NmL/gVS), vs_percent (% wet weight = vs_wet)
#   TypeScript frontend  : bmp (NmL/gVS), vs (VS/TS fraction = vs_of_ts/100)
#   JSON fde_residues    : bmp_value (NmL/gVS)
#
# To add a feedstock: copy any entry, assign a unique code, fill all fields,
# and add at least 2 refs per parameter. Run the generator to propagate.
# =============================================================================

feedstocks:

  # ── Sugarcane sector ────────────────────────────────────────────────────────

  BAGACO:
    pt_name: "Bagaço de cana-de-açúcar"
    en_name: "Sugarcane bagasse"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CANA"
    bmp:
      min: 115.0
      medio: 165.0
      max: 220.0
      refs:
        - id: "paulose2021_bagaco"
          value: "187.9 ± 2.4 NmL/gVS untreated mesophilic batch 37 °C ISR=2 (primary reference)"
        - id: "talha2016_bagaco"
          value: "86.25–143.75 NmL/gVS untreated batch; median 115 used as conservative min"
        - id: "velasquez2020_sugarcane"
          value: "218 NmL/gVS steam-explosion pretreated; max anchor"
        - id: "unica2023_straw"
          value: "115 NmL/gVS industry conservative reference"
    ts:
      min: 50.0
      medio: 58.9
      max: 66.0
      refs: ["talha2016_bagaco", "velasquez2020_sugarcane"]
    vs_of_ts:
      min: 76.5
      medio: 90.0
      max: 97.0
      refs: ["talha2016_bagaco"]
    ch4_pct: 55.0
    cn_ratio: 29.6
    # Service layer: aggregate used as-is (no competing streams in this code)
    service_override:
      note: "bagaço-only stream; vs_wet = 58.9 × 90/100 = 53.0%"
    # Effective availability for the forward calculation. FDE = availability × eta.
    # availability = FC×FCo×FS×FL (CP2B Panorama composite; ~82% of bagasse goes to
    # cogeneration so FCo is low). eta = conversion efficiency (lignocellulosic).
    fde:
      # availability = FC×FCo×FS×FL; FDE = availability × eta
      # FCo update (2026-06): EPE BEN 2024 shows bagasse energy sector consumption
      # DECREASED 2% in 2024. Modern SP boilers (87–100 bar) leave 30–50% surplus
      # vs legacy 42-bar boilers (~18% surplus). CETESB Decision 39/2017 mandates
      # cogeneration priority but does not cap the surplus fraction.
      # FCo range 0.15–0.38 reflects legacy mills (min) to modern high-pressure mills (max).
      availability: { min: 0.0803, medio: 0.1693, max: 0.3467 }
      eta: 0.70
      components:
        fc:  { min: 0.90, medio: 0.95, max: 0.98 }
        fco: { min: 0.15, medio: 0.22, max: 0.38 }   # surplus fraction beyond mandatory cogeneration
        fs:  { min: 0.70, medio: 0.90, max: 0.95 }
        fl:  { min: 0.85, medio: 0.90, max: 0.98 }
      refs:
        - id: "epe_ben2024"
          value: "Bagasse energy sector consumption -2% in 2024; surplus trend confirmed"
        - id: "paulose2021_bagaco"
          value: "Modern SP mills surplus fraction 15–38%; legacy mills ~18%"
        - id: "abiogas2021_atlas"
          value: "Brazilian availability methodology"
        - id: "hashimoto1989_lignocellulosic"
          value: "eta 0.70 lignocellulosic conversion efficiency"

  PALHA:
    pt_name: "Palha de cana-de-açúcar"
    en_name: "Sugarcane straw"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CANA"
    bmp:
      min: 140.0
      medio: 175.0
      max: 250.0
      refs:
        - id: "paulose2021_bagaco"
          value: "161.8 NmL/gVS untreated straw/trash mesophilic batch (primary reference)"
        - id: "velasquez2020_sugarcane"
          value: "185–250 NmL/gVS mechanically collected straw; max anchor"
        - id: "talha2016_bagaco"
          value: "~140 NmL/gVS dry-harvest conditions; conservative min"
    ts:
      min: 18.0
      medio: 30.0
      max: 55.0
      refs: ["velasquez2020_sugarcane"]
    vs_of_ts:
      min: 72.0
      medio: 82.0
      max: 92.0
      refs: ["velasquez2020_sugarcane"]
    ch4_pct: 55.0
    cn_ratio: 75.0
    notes: >
      Collectible fraction capped at 35% of total palhiço (12 t/ha) per
      EMBRAPA/CONAB guidelines (Tenelli et al. 2021, doi:10.1016/j.agee.2021.107458).
      Used yield_t_ha = 4.2 t/ha in load_biomass_tons.py.
    yield_refs: ["tenelli2021_straw", "unica2023_straw"]

  VINHACA:
    pt_name: "Vinhaça de cana-de-açúcar"
    en_name: "Sugarcane vinasse"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CANA"
    bmp:
      min: 40.0
      medio: 90.0
      max: 160.0
      refs:
        - id: "bonomi2015_vinhaca"
          value: "50–130 NmL/gVS; typical SP vinhaça ~85 NmL/gVS at VS ~1.5% wet"
    ts:
      min: 1.0
      medio: 3.0
      max: 5.0
      refs: ["bonomi2015_vinhaca"]
    vs_of_ts:
      min: 45.0
      medio: 60.0
      max: 75.0
      refs: ["bonomi2015_vinhaca"]
    ch4_pct: 65.0
    cn_ratio: 5.0
    notes: >
      Current JSON (bmp=300) and frontend (bmp=350) are severely overestimated.
      Vinhaça is very dilute (VS ~1–5% wet); BMP per gVS is moderate but energy density
      per m³ liquid is low. CETESB P4.231 regulates fertigation as primary use (FCo ~0.89).
    frontend_vs_convention: "decimal_wet_weight"
    # FDE: CETESB P4.231 mandates ≥85% of vinhaça to fertigation → FCo ≤0.15 max for surplus.
    # FC=0.95: liquid piped directly; FL=0.92: already transported to field application points.
    # FS=0.90: follows harvest season (Apr–Nov in SP central belt).
    # availability = FC×FCo×FS×FL; FDE = availability × eta (0.65 mesophilic liquid)
    fde:
      availability: { min: 0.0673, medio: 0.1155, max: 0.2325 }
      eta: 0.65
      components:
        fc:  { min: 0.90, medio: 0.95, max: 0.95 }
        fco: { min: 0.10, medio: 0.15, max: 0.28 }   # 10–28% surplus beyond mandatory fertigation
        fs:  { min: 0.85, medio: 0.90, max: 0.95 }
        fl:  { min: 0.88, medio: 0.90, max: 0.92 }
      refs:
        - id: "bonomi2015_vinhaca"
          value: "CETESB P4.231: 85% minimum fertigation → FCo max 0.15 typical; surplus 0.10–0.28"
        - id: "epe2020_biogas"
          value: "eta 0.65 for dilute substrate (VS ~1–5% wet) mesophilic CSTR"

  TORTA_FILTRO:
    pt_name: "Torta de filtro"
    en_name: "Sugarcane filter cake / press mud"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CANA"
    bmp:
      min: 200.0
      medio: 280.0
      max: 380.0
      refs:
        - id: "talha2016_bagaco"
          value: "Talha 2016 covers filter mud: 200–380 NmL/gVS (low lignin)"
        - id: "velasquez2020_sugarcane"
          value: "280 NmL/gVS CSTR mesophilic"
    ts:
      min: 28.0
      medio: 38.0
      max: 48.0
      refs: ["talha2016_bagaco"]
    vs_of_ts:
      min: 68.0
      medio: 80.0
      max: 90.0
      refs: ["talha2016_bagaco"]
    ch4_pct: 60.0
    cn_ratio: 22.0
    # FDE: filter cake primarily applied as fertilizer; surplus fraction directed to biogas.
    # FCo range reflects low (25%: mostly to fields) to high (42%: excess at large mills).
    # availability = FC×FCo×FS×FL; FDE = availability × eta (0.72 for low-lignin substrate)
    fde:
      availability: { min: 0.1166, medio: 0.2018, max: 0.3325 }
      eta: 0.72
      components:
        fc:  { min: 0.85, medio: 0.90, max: 0.95 }
        fco: { min: 0.22, medio: 0.30, max: 0.40 }   # 22–40% surplus beyond field application
        fs:  { min: 0.80, medio: 0.88, max: 0.95 }
        fl:  { min: 0.78, medio: 0.85, max: 0.92 }
      refs:
        - id: "velasquez2020_sugarcane"
          value: "Filter cake FCo 30% baseline; FS 88% follows cane harvest season"
        - id: "abiogas2021_atlas"
          value: "eta 0.72 for low-lignin carbohydrate-rich filter cake; FC/FL methodology"

  # ── Citrus sector ───────────────────────────────────────────────────────────

  BAGACO_CITROS:
    pt_name: "Bagaço de citros"
    en_name: "Citrus bagasse"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CITRICULTURA"
    bmp:
      min: 170.0
      medio: 230.0
      max: 310.0
      refs:
        - id: "wikandari2014_citrus"
          value: "170–200 NmL/gVS without pretreatment; limonene inhibition at >200 mg/L"
        - id: "pourbafrani2010_citrus"
          value: "Citrus characterization; BMP potential up to 310 with limonene removal"
    ts:
      min: 10.0
      medio: 18.0
      max: 26.0
      refs: ["pourbafrani2010_citrus"]
    vs_of_ts:
      min: 82.0
      medio: 88.0
      max: 94.0
      refs: ["wikandari2014_citrus"]
    ch4_pct: 56.0
    cn_ratio: 22.0
    notes: >
      D-limonene in peel (0.5–2.5% DM) inhibits methanogenesis above ~200 mg/kg.
      Current frontend value (bmp=340) and service (bmp=300) are overestimates.
      Without limonene pretreatment, median of 230 is appropriate for SP bulk processing.
    fde:
      availability: { min: 0.0975, medio: 0.1721, max: 0.2600 }
      eta: 0.78
      components:
        fc:  { min: 0.75, medio: 0.85, max: 0.92 }   # juice processing recovers 85% of pomace (Lohrasbi 2010)
        fco: { min: 0.25, medio: 0.30, max: 0.35 }   # 70% to pectin/cattle feed → 30% available (Braddock 1999)
        fs:  { min: 0.80, medio: 0.90, max: 0.95 }   # citrus harvest April–Dec (FUNDECITRUS 2022)
        fl:  { min: 0.65, medio: 0.75, max: 0.85 }   # "citrus belt" concentration; 30–40 km transport
      refs:
        - id: "abiogas2021_atlas"
          value: "Citrus residue availability: FEEDSTOCK_FACTORS FC=0.85, FCo=0.30, FS=0.90, FL=0.75 → FDE=17.21%"
        - id: "wikandari2014_citrus"
          value: "eta 0.78; limonene at >200 mg/kg inhibits methanogenesis; Braddock 1999 FCo"

  CASCAS_CITROS:
    pt_name: "Cascas de citros"
    en_name: "Citrus peel"
    sector: "AG_AGRICULTURA"
    subsector: "AG_CITRICULTURA"
    bmp:
      min: 160.0
      medio: 210.0
      max: 290.0
      refs:
        - id: "wikandari2014_citrus"
          value: "Peel BMP lower than bagasse due to higher limonene concentration"
        - id: "pourbafrani2010_citrus"
          value: "Peel TS ~20% wet; VS/TS ~88%"
    ts:
      min: 15.0
      medio: 20.0
      max: 28.0
      refs: ["pourbafrani2010_citrus"]
    vs_of_ts:
      min: 80.0
      medio: 88.0
      max: 94.0
      refs: ["wikandari2014_citrus"]
    ch4_pct: 56.0
    cn_ratio: 20.0

