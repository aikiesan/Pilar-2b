  # ── Livestock sector ────────────────────────────────────────────────────────

  CAMA_AVIARIO:
    pt_name: "Cama de aviário"
    en_name: "Poultry litter (with bedding)"
    sector: "PC_PECUARIA"
    subsector: "PC_AVES"
    bmp:
      min: 200.0
      medio: 280.0
      max: 360.0
      refs:
        - id: "abouelenien2014_poultry"
          value: "Poultry litter BMP 200–320 NmL/gVS (cama de aviário with sawdust bedding)"
        - id: "angelidaki2003_manure"
          value: "280 NmL/gVS reference for litter in co-digestion"
    ts:
      min: 21.25
      medio: 25.0
      max: 28.75
      refs: ["abouelenien2014_poultry"]
    vs_of_ts:
      min: 62.82
      medio: 69.8
      max: 76.78
      refs: ["abouelenien2014_poultry"]
    ch4_pct: 62.5
    cn_ratio: 10.0
    notes: "Current SQL (290) is correct. Low C:N (~10–12) requires co-digestion to avoid NH3 inhibition."
    generation:
      type: "per_head"
      t_per_head_yr:
        min: 0.035   # 96 g/bird/day × 365 (broiler basis)
        medio: 0.045  # 123 g/bird/day × 365 (mixed flock, including layers)
        max: 0.060   # 164 g/bird/day × 365 (layer-dominated or high-density)
        refs: ["avila2007_poultry", "embrapa2012_aves"]
      notes: >
        SP state has mixed broiler + layer population. Broiler litter accumulates
        across 5–7 flocks/year; layers produce ~35 kg manure/hen/yr. Median 0.045
        t/head/yr is appropriate for a mixed SP composition.
    fde:
      availability: { min: 0.1529, medio: 0.2700, max: 0.4165 }
      eta: 0.70
      components:
        fc:  { min: 0.70, medio: 0.80, max: 0.88 }   # commercial confined systems collect 80% litter (Oliveira 2016)
        fco: { min: 0.42, medio: 0.50, max: 0.58 }   # 50% to animal feed → 50% available (Avila 2007)
        fs:  { min: 0.80, medio: 0.90, max: 0.96 }   # continuous poultry production; ~10% seasonal variation (ABPA 2022)
