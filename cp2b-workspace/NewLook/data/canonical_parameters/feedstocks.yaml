      type: "per_head"
      t_per_head_yr:
        min: 0.73   # 2.0 kg wet excretion/head/day × 365 (small piglet / feeder)
        medio: 1.28  # 3.5 kg/head/day × 365 (finisher pig average SP state)
        max: 2.00   # 5.5 kg/head/day × 365 (large finisher / breeding sow)
        refs: ["embrapa2012_swine", "kunz2009_swine"]
      notes: >
        EMBRAPA Suínos e Aves (Concórdia): finisher pig 5.5 kg/day, but SP state
        headcount mixes all lifecycle stages → 3.5 kg/day is appropriate.
        CRITICAL NOTE: The legacy conversion factor of 461 m³ biogas/head/yr for swine
        in 03_conversion_factors.csv is ~7.5× overestimated. Correct value
        (3.5 kg/day × canonical BMP) ≈ 55–65 m³ biogas/head/yr.
    # ── DEGRADATION NOTE ──────────────────────────────────────────────────────
    # Swine slurry VS degrades rapidly in open anaerobic lagoons: 20–35% VS loss
    # within 30 days at SP temperatures (25–30°C). FL captures both physical
    # logistics AND collection timing:
    #   FL.min = 0.55: open-lagoon storage 30+ days before collection (common in
    #            small operations); net effective VS delivered to digester ≈ 65–75%
    #            of excreted VS (30–35% already degraded with low CH4 capture).
    #   FL.max = 0.88: slurry pit capture within 24–48 h of production; minimal VS
    #            loss; high-quality substrate to digester.
    # All SP swine production is intensive/concentrated (user confirmed) → FC stays high.
    fde:
      availability: { min: 0.2057, medio: 0.3387, max: 0.4913 }
      eta: 0.75
      components:
        fc:  { min: 0.85, medio: 0.90, max: 0.95 }   # 90%+ confined; user confirmed all SP swine concentrated
        fco: { min: 0.50, medio: 0.55, max: 0.60 }   # 45% fertigation → 55% available (Kunz 2009)
        fs:  { min: 0.88, medio: 0.95, max: 0.98 }   # continuous year-round production (ABCS 2016)
        fl:  { min: 0.55, medio: 0.72, max: 0.88 }   # includes VS degradation penalty: open lagoon (min) to prompt capture (max)
      refs:
        - id: "embrapa2012_swine"
          value: "FC=0.90; all SP swine concentrated; FEEDSTOCK_FACTORS: FC=0.90, FCo=0.55, FS=0.95"
        - id: "kunz2009_swine"
          value: "FCo=0.55 (Kunz 2009); FL.min 0.55 accounts for 30% VS loss in open lagoon 30d at 28°C"
        - id: "moller2004_manure"
          value: "Swine slurry VS degradation: 20–35% in 30-day pre-storage at 20–30°C; justifies FL range"
        - id: "angelidaki2003_manure"
          value: "eta 0.75 (liquid swine slurry — high accessible VS, mesophilic CSTR)"

