        max: 5.11   # 14 kg/head/day × 365 (semi-confined or dairy operations)
        refs: ["embrapa2015_cattle", "primavesi2004_cattle"]
      notes: >
        EMBRAPA PECUÁRIA SUDESTE: beef cattle 8–12 kg/head/day fresh excretion;
        dairy 10–18 kg/head/day. SP state has mixed beef/dairy → 10 kg/day median.
        Note: master CSV residue_tons_yr for cattle is HEAD COUNT, not tonnes.
    # ── TWO SUB-SCENARIOS FOR SP STATE ────────────────────────────────────────
    # SP cattle is spatially split between two systems (IBGE Censo Agropecuário 2017):
    #   WEST  (Araçatuba, Pres. Prudente, Marília region): extensive beef, open pasture.
    #         FC very low — most excretion falls across hectares; only feedlot portion
    #         (~30% of western beef) is collectible. FCo low due to limited biogas
    #         infrastructure; FL penalised by very dispersed farm locations.
    #   EAST  (Campinas, Sorocaba, Ribeirão Preto, Piracicaba): intensive dairy in
    #         confinement/barns (scraping/slatted floors). FC high; FCo high; FL high
    #         (dairy cooperative clusters enable shared collection routes).
    # SP mix (2017 census): ~67% beef/semi-extensive + ~33% dairy/intensive.
    # min scenario = fully extensive beef (west); medio = SP weighted mix; max = intensive dairy (east).
    fde:
      availability: { min: 0.0437, medio: 0.1320, max: 0.3994 }
      eta: 0.70
      components:
        fc:  { min: 0.35, medio: 0.55, max: 0.88 }   # min=only feedlot fraction collectible; max=dairy confinement
        fco: { min: 0.32, medio: 0.45, max: 0.58 }   # min=mainly organic fertilizer; max=dairy cooperative biogas
        fs:  { min: 0.75, medio: 0.82, max: 0.92 }   # min=wet season limits collection; max=continuous dairy
        fl:  { min: 0.52, medio: 0.65, max: 0.85 }   # min=dispersed pasture farms; max=concentrated dairy belt
      refs:
        - id: "ibge2017_censo"
          value: "SP cattle: ~7M beef (67%) + ~3.5M dairy (33%); spatial split documented"
        - id: "primavesi2004_cattle"
          value: "FCo=0.45 SP median; dairy FCo=0.58 (Primavesi 2004); Coldebella 2006 FL values"
        - id: "embrapa2015_cattle"
          value: "FC ranges: pasture beef 0.30–0.40 (feedlot fraction only); confinement dairy 0.85–0.92"
        - id: "angelidaki2003_manure"
          value: "eta 0.70 (solid cattle manure; compromise Angelidaki CSTRs 0.85 / Brazilian digesters 0.65)"

