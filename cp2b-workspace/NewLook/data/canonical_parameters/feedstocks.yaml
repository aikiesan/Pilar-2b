feedstocks:
  BAGACO:
    pt_name: Bagaço de cana-de-açúcar
    en_name: Sugarcane bagasse
    sector: AG_AGRICULTURA
    subsector: AG_CANA
    rpr:
      min: 0.25
      medio: 0.28
      max: 0.3
      basis: t wet bagasse / t cane MILLED
      refs:
      - epe_ben2024
      - talha2016_bagaco
      - velasquez2020_sugarcane
      notes: '50% moisture, as delivered from the mill. Gross ratio; collectability
        and the competing use as boiler fuel live in the fde block.

        '
    mill_delivery_fraction:
      min: 0.76
      medio: 0.85
      max: 0.92
      basis: t cane milled / t cane produced (PAM)
      refs:
      - unica2023_straw
      notes: 'UNICA histórico de moagem vs IBGE PAM production, national, 2008–2024.
        Band spans the observed range rather than a confidence interval — the year-to-year
        variation is genuine (harvest quality, sugar/ethanol mix), not measurement
        error.

        '
    bmp:
      min: 115.0
      medio: 115.0
      max: 220.0
      corpus:
        n: 6
        median: 191.9
        coverage: sufficient
        provenance: quarantined_unversioned_source
      refs:
      - id: paulose2021_bagaco
        value: 187.9 ± 2.4 NmL/gVS untreated mesophilic batch 37 °C ISR=2 (primary
          reference)
      - id: talha2016_bagaco
        value: 86.25–143.75 NmL/gVS untreated batch; median 115 used as conservative
          min
      - id: velasquez2020_sugarcane
        value: 218 NmL/gVS steam-explosion pretreated; max anchor
      - id: unica2023_straw
        value: 115 NmL/gVS industry conservative reference
    ts:
      min: 50.0
      medio: 58.9
      max: 66.0
      refs:
      - talha2016_bagaco
      - velasquez2020_sugarcane
    vs_of_ts:
      min: 76.5
      medio: 90.0
      max: 97.0
      refs:
      - talha2016_bagaco
    ch4_pct: 55.0
    cn_ratio: 29.6
    service_override:
      note: bagaço-only stream; vs_wet = 58.9 × 90/100 = 53.0%
    fde:
      confidence: HIGH
      eta: 0.7
      components:
        fc:
          min: 0.9
          medio: 0.95
          max: 0.98
          reference: abiogas2021_atlas
        fco_available:
          min: 0.15
          medio: 0.165
          max: 0.18
          reference: bonomi2015_bagasse_surplus
        fs:
          min: 1.0
          medio: 1.0
          max: 1.0
          reference: IBGE PAM annual activity; B5-FS class (a)
        fl:
          min: 0.85
          medio: 0.9
          max: 0.98
          reference: abiogas2021_atlas
      refs:
      - id: epe_ben2024
        value: Bagasse energy sector consumption -2% in 2024; surplus trend confirmed
      - id: paulose2021_bagaco
        value: Modern SP mills surplus fraction 15–38%; legacy mills ~18%
      - id: abiogas2021_atlas
        value: Brazilian availability methodology
      - id: hashimoto1989_lignocellulosic
        value: eta 0.70 lignocellulosic conversion efficiency
