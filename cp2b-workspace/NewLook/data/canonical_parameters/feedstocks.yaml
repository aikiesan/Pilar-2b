  # ── Soybean sector ──────────────────────────────────────────────────────────

  CASCA_SOJA:
    pt_name: "Casca de soja"
    en_name: "Soybean hull (processing residue at crushing mills)"
    sector: "AG_AGRICULTURA"
    subsector: "AG_SOJA"
    bmp:
      min: 230.0
      medio: 300.0
      max: 380.0
      refs:
        - id: "kafle2016_soy"
          value: "Soybean hull BMP 260–380 NmL/gVS; low lignin, high cellulose"
    ts:
      min: 86.0
      medio: 90.0
      max: 93.0
      refs: ["kafle2016_soy"]
    vs_of_ts:
      min: 88.0
      medio: 93.0
      max: 97.0
      refs: ["kafle2016_soy"]
    ch4_pct: 55.0
    cn_ratio: 32.0
    notes: >
      Current JSON (bmp=400) overestimates; 300 is more appropriate for bulk hull.
      CRITICAL MAPPING NOTE: The 'soybean' stream in the master CSV
      (01_master_residue_streams_SP_2023.csv) represents FIELD STRAW
      (palha_soja), not processing hull. SP soy straw ≈6.1M t/yr (area-based);
      soy hull at crushing mills ≈0.32M t/yr (8% of grain). Since 85%+ of
      SP soy is under RTRS/no-till certification, field straw (palha_soja)
      has FCo=0 (100% soil return required). Use CASCA_SOJA only for the
      processing hull sub-stream (~0.32M t/yr); use PALHA_SOJA with FDE≈0
      for field straw. See PALHA_SOJA notes.
    fde:
      availability: { min: 0.0927, medio: 0.1785, max: 0.3097 }
      eta: 0.70
      components:
        fc:  { min: 0.60, medio: 0.75, max: 0.90 }   # Processing mills recover 75% of hulls
        fco: { min: 0.36, medio: 0.40, max: 0.44 }   # 40% to biogas; 60% to animal feed (high-value)
        fs:  { min: 0.78, medio: 0.85, max: 0.92 }   # follows soy crushing season
        fl:  { min: 0.55, medio: 0.70, max: 0.85 }   # concentrated at crushing facilities; transport viable
      refs:
        - id: "abiogas2021_atlas"
          value: "Soybean hull availability: 40% available after animal feed allocation"
        - id: "kafle2016_soy"
          value: "eta 0.70 soybean hull; FEEDSTOCK_FACTORS_LITERATURE_TABLE: avail=17.85%"

  PALHA_SOJA:
    pt_name: "Palha de soja"
    en_name: "Soybean straw"
    sector: "AG_AGRICULTURA"
    subsector: "AG_SOJA"
    bmp:
      min: 150.0
      medio: 220.0
      max: 280.0
      refs:
        - id: "kafle2016_soy"
          value: "Soybean straw BMP 150–250 NmL/gVS; higher lignin than hull"
        - id: "herrmann2012_corn"
          value: "Comparable to corn straw; 180–280 NmL/gVS"
    ts:
      min: 80.0
      medio: 84.0
      max: 88.0
      refs: ["kafle2016_soy"]
    vs_of_ts:
      min: 80.0
      medio: 85.0
      max: 90.0
      refs: ["kafle2016_soy"]
    ch4_pct: 55.0
    cn_ratio: 55.0

