# Registro de Números Oficiais do PILAR-2b (semente, 2026-10-19)
#
# Um indicador, um valor, uma fonte. Estratégia 2027 §2.1:
#   docs/planning/ESTRATEGIA_2027_LIDERANCA_BIOECONOMIA.md
#
# Cada entrada aponta para o lugar do repositório que produz o número, e
# scripts/verify_official_figures.py recalcula ou relê cada um a partir dessa
# fonte. Se a fonte mudar e este arquivo não, o verificador falha.
#
# status:
#   vigente      — pode aparecer na interface, no dossiê e no paper
#   substituido  — não pode aparecer como manchete; fica aqui para que um número
#                  antigo encontrado num slide ou e-mail possa ser identificado
#   pendente     — aguarda decisão (ver `decisao`)
#
# rotulo_publico: o nome exato com que o número pode ser exibido. Dois números
# vigentes nunca têm o mesmo rótulo.
#
# verificar.tipo:
#   python_const — literal Python lido por AST (sem importar o módulo)
#   json         — caminho dentro de um JSON
#   script       — soma da função `calcular(rows, tier)` de um script de cenário
#   csv_sum      — soma de uma coluna de CSV com filtro

versao: 1
unidade_padrao: Nm3 CH4/ano

