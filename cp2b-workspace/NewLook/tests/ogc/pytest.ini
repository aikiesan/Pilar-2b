[pytest]
# Standalone OGC test suite (assembly + acceptance) against a live GeoServer.
# Run from this directory:  pytest -v
# The CITE conformance run is separate — see cite/run_cite.py.
markers =
    ogc_assembly: stack assembly / OGC service smoke tests
    ogc_acceptance: PILAR-2b layer behaviour / domain acceptance tests
addopts = -ra
testpaths = .
