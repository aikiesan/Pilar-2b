# PILAR-2b V3 — Local Development Environment
# Usage: docker compose up --build
# See docs/LOCAL_DOCKER_SETUP.md for full instructions.

services:

  # ─── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    container_name: cp2b-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cp2b_maps
    ports:
      - "5432:5432"
    volumes:
      - cp2b_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cp2b_maps"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Database Migrations & Auto-Seeding ──────────────────────────────────
  db-migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cp2b-db-migrations-dev
    command: python scripts/run_migrations.py --seed
    volumes:
      - ./backend:/app
      - ./data/canonical_parameters:/app/data/canonical_parameters:ro
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/cp2b_maps
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Optional one-shot loader for the large, gitignored infrastructure vectors.
  # Run with: docker compose --profile infrastructure run --rm infrastructure-loader
  infrastructure-loader:
    profiles: ["infrastructure"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command:
      - python
      - scripts/setup_local_infrastructure.py
      - --archive-dir
      - /mnt/mapbiomas_archives
    volumes:
      - ./backend:/app
      - ${MAPBIOMAS_ARCHIVE_DIR:-../../00_Fontes_Primarias-20260802T093400Z-1-001/shapefiles_infraestrutura_mapbiomas}:/mnt/mapbiomas_archives:ro
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/cp2b_maps
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    restart: "no"

  # ─── FastAPI backend (hot-reload) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cp2b-backend-dev
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Bind-mount source — changes in your IDE are visible instantly
      - ./backend:/app
      # feedstocks.yaml — single source of truth for every BMP/TS/VS/FDE value.
      # It lives at <NewLook>/data/, and the bind above only exposes backend/,
      # so without this the container has no canonical parameters at all.
      - ./data/canonical_parameters:/app/data/canonical_parameters:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    env_file:
      - .env.docker       # copy from .env.docker.example
    environment:
      # Override / supplement anything in .env.docker
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:password@db:5432/cp2b_maps
      PYTHONUNBUFFERED: "1"

  # ─── Next.js frontend (hot-reload) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cp2b-frontend-dev
    restart: unless-stopped
    # -H 0.0.0.0 makes Next.js listen on all interfaces inside the container
    command: npm run dev -- -H 0.0.0.0 -p 3006
    volumes:
      # Bind-mount source — changes in your IDE are visible instantly
      - ./frontend:/app
      # Anonymous volume shadows the bind-mount for node_modules so the
      # container's npm-installed modules are used, not the host's.
      - /app/node_modules
      # Anonymous volume keeps .next on the container's local filesystem.
      # Without this, Turbopack writes its cache through the Windows bind-mount
      # (slow filesystem) and the route cache gets corrupted, causing 404s.
      - /app/.next
    ports:
      - "3006:3006"
    depends_on:
      - backend
    environment:
      # Explicitly set development mode so next.config.js isProd=false,
      # which keeps basePath empty and lets localhost:3006/pt-BR work.
      NODE_ENV: development
      # The browser calls the backend directly via localhost, not via the
      # Docker network name, so localhost:8000 is correct here.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Pre-VM phase: run with auth OFF so every local visitor is transparently a
      # test user (see AuthContext.tsx TEST_USER). Set back to "false" once real
      # auth is wired up on the UNICAMP VM. NEXT_PUBLIC_* is inlined at compile
      # time, so a `docker compose up -d frontend` restart is needed after changing it.
      NEXT_PUBLIC_DISABLE_AUTH: "true"
      # Disable telemetry inside Docker
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  cp2b_pg_data:
    driver: local
