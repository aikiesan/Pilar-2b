name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend-lint-and-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # Blocking from the day it was added: both were verified green on main at
      # 7499a6c before being wired in here.
      #
      # i18n:check is the gate that would have caught the eight missing
      # calculator.step2.* keys, which shipped to the English wizard as raw key
      # names because nothing compared the catalogs. It also flags ICU
      # placeholder drift, which next-intl only raises at render time.
      #
      # typecheck covers what `next build` already type-checks, but fails in
      # seconds instead of after a full build. Note it does NOT yet cover
      # e2e/, src/test or __tests__ — those are excluded in tsconfig.json and
      # currently carry 117 errors, mostly partial test fixtures (tracked in
      # docs/planning/ROADMAP_2026-09_EN_AND_LEAN.md).
      # i18n:check: catalog parity, a scan of every source file for hardcoded
      # Portuguese, no unused catalog key, bilingual patch notes, and the
      # scanner's own tests. The scan exists because the e2e locale test only
      # sees what renders on page load — popups and expandable panels stayed
      # fully Portuguese underneath a passing /en/map.
      - name: i18n catalog parity and hardcoded-string scan
        run: npm run i18n:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL != '' && secrets.NEXT_PUBLIC_API_URL || 'https://newlook-production.up.railway.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-build' }}

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --ci --maxWorkers=2
      - name: Run accessibility tests
        run: npm run test:a11y -- --ci --passWithNoTests

  frontend-security:
    name: Frontend - Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (critical only)
        run: npm audit --production --audit-level=critical

  frontend-e2e:
    name: Frontend - E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Blocking, unlike the broad suite below. The locale assertions read text
      # rendered from the message catalogs, not from the API, so the CORS
      # problem that forces the next step to be soft does not reach them —
      # verified locally with no backend running at all.
      - name: Locale integrity (/en/ renders no Portuguese UI)
        run: npx playwright test --project=public e2e/i18n.public.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-build' }}
      # Soft gate (continue-on-error): the suite is not reliably green in CI
      # because NEXT_PUBLIC_API_URL below points the localhost:3000 frontend
      # at the live production backend, whose CORS policy rejects localhost —
      # map-load tests then time out (verified in run logs: 28568906651,
      # and PR #135's earlier run: 3 failed + 6 flaky). Re-harden by removing
      # continue-on-error once E2E targets a non-production backend with
      # permissive CORS for the test origin (needs a seeded DB — a real
      # project, tracked in docs/planning/IMPROVEMENT_BACKLOG.md).
      - name: Run E2E tests (public pages)
        run: npm run test:e2e:public
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: https://newlook-production.up.railway.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-build' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: cp2b-workspace/NewLook/frontend/playwright-report/
          retention-days: 7

  # ── Backend ──────────────────────────────────────────────────────────────────

  backend-lint:
    name: Backend - Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt black isort flake8
      - name: Black format check
        run: black . --check
      - name: isort import check
        run: isort . --check-only
      - name: Flake8 lint
        run: flake8 app/ --max-line-length=100 --extend-ignore=E203,W503

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --cov=app --cov-report=xml --no-cov-on-fail
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only-xxxx
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  backend-security:
    name: Backend - Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install -r requirements.txt safety bandit
      - name: Safety check
        run: safety check
      - name: Bandit SAST scan
        run: bandit -r app/ -f json -o bandit-report.json -c pyproject.toml
        continue-on-error: true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: cp2b-workspace/NewLook/backend/bandit-report.json
          retention-days: 7

  # ── Summary ──────────────────────────────────────────────────────────────────

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-lint-and-build
      - frontend-test
      - frontend-security
      - frontend-e2e
      - backend-lint
      - backend-test
      - backend-security
    if: always()
    steps:
      - run: |
          echo "Frontend Lint & Build : ${{ needs.frontend-lint-and-build.result }}"
          echo "Frontend Tests        : ${{ needs.frontend-test.result }}"
          echo "Frontend Security     : ${{ needs.frontend-security.result }}"
          echo "Frontend E2E          : ${{ needs.frontend-e2e.result }}"
          echo "Backend Lint          : ${{ needs.backend-lint.result }}"
          echo "Backend Tests         : ${{ needs.backend-test.result }}"
          echo "Backend Security      : ${{ needs.backend-security.result }}"
