name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint-and-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './cp2b-workspace/NewLook/frontend/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://newlook-production.up.railway.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-key-for-build' }}

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './cp2b-workspace/NewLook/frontend/package-lock.json'
      - run: npm ci
      - run: npm test -- --ci --coverage --maxWorkers=2
      - run: npm run test:a11y -- --ci --passWithNoTests

  frontend-security:
    name: Frontend - Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './cp2b-workspace/NewLook/frontend/package-lock.json'
      - run: npm ci
      - run: npm audit --production --audit-level=high

  frontend-e2e:
    name: Frontend - E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './cp2b-workspace/NewLook/frontend/package-lock.json'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://newlook-production.up.railway.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-key-for-build' }}
      - name: Run E2E tests (public pages)
        run: npm run test:e2e:public
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://newlook-production.up.railway.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy-key-for-build' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cp2b-workspace/NewLook/frontend/playwright-report/
          retention-days: 7

  backend-lint:
    name: Backend - Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: './cp2b-workspace/NewLook/backend/requirements.txt'
      - run: pip install -r requirements.txt black isort flake8
      - run: black . --check
      - run: isort . --check-only
      - run: flake8 app/ --max-line-length=100 --extend-ignore=E203,W503
        continue-on-error: true

  backend-test:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: './cp2b-workspace/NewLook/backend/requirements.txt'
      - run: pip install -r requirements.txt
      - run: pytest -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key

  backend-security:
    name: Backend - Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: './cp2b-workspace/NewLook/backend/requirements.txt'
      - run: pip install -r requirements.txt safety
      - run: safety check
        continue-on-error: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-build, frontend-test, frontend-security, backend-lint, backend-test, backend-security]
    if: always()
    steps:
      - run: |
          echo "Frontend Lint & Build : ${{ needs.frontend-lint-and-build.result }}"
          echo "Frontend Tests        : ${{ needs.frontend-test.result }}"
          echo "Frontend Security     : ${{ needs.frontend-security.result }}"
          echo "Backend Lint          : ${{ needs.backend-lint.result }}"
          echo "Backend Tests         : ${{ needs.backend-test.result }}"
          echo "Backend Security      : ${{ needs.backend-security.result }}"
