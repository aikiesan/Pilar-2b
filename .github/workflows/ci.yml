name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend-lint-and-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL != '' && secrets.NEXT_PUBLIC_API_URL || 'https://newlook-production.up.railway.app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-build' }}

  frontend-test:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --ci --maxWorkers=2
      - name: Run accessibility tests
        run: npm run test:a11y -- --ci --passWithNoTests
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: cp2b-workspace/NewLook/frontend/coverage/
          retention-days: 7

  frontend-security:
    name: Frontend - Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security audit (critical only)
        run: npm audit --production --audit-level=critical
        continue-on-error: true

  frontend-e2e:
    name: Frontend - E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run E2E tests (public pages — Chromium + Firefox)
        run: npx playwright test --project=public --project=chromium --reporter=github,html
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: https://newlook-production.up.railway.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-for-build' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: cp2b-workspace/NewLook/frontend/playwright-report/
          retention-days: 7

  # ── Backend ──────────────────────────────────────────────────────────────────

  backend-lint:
    name: Backend - Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt black isort flake8
      - name: Black format check
        run: black . --check
        continue-on-error: true
      - name: isort import check
        run: isort . --check-only
        continue-on-error: true
      - name: Flake8 lint
        run: flake8 app/ --max-line-length=100 --extend-ignore=E203,W503
        continue-on-error: true

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing --no-cov-on-fail
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only-xxxx
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: cp2b-workspace/NewLook/backend/coverage.xml
          retention-days: 7

  backend-security:
    name: Backend - Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ./cp2b-workspace/NewLook/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt safety bandit
      - name: Safety check
        run: safety check
        continue-on-error: true
      - name: Bandit SAST scan
        run: bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: cp2b-workspace/NewLook/backend/bandit-report.json
          retention-days: 7

  # ── Production smoke (push to main only) ─────────────────────────────────────

  smoke-production:
    name: Smoke - Production
    runs-on: ubuntu-latest
    needs:
      - frontend-lint-and-build
      - backend-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./cp2b-workspace/NewLook/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./cp2b-workspace/NewLook/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test production
        run: npx playwright test e2e/smoke.spec.ts --project=public --reporter=github
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: https://cp2b.unicamp.br/pilar2b
          NEXT_PUBLIC_API_URL: https://newlook-production.up.railway.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-production-report
          path: cp2b-workspace/NewLook/frontend/playwright-report/
          retention-days: 3

  # ── Summary ──────────────────────────────────────────────────────────────────

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - frontend-lint-and-build
      - frontend-test
      - frontend-security
      - frontend-e2e
      - backend-lint
      - backend-test
      - backend-security
    if: always()
    steps:
      - run: |
          echo "Frontend Lint & Build : ${{ needs.frontend-lint-and-build.result }}"
          echo "Frontend Tests        : ${{ needs.frontend-test.result }}"
          echo "Frontend Security     : ${{ needs.frontend-security.result }}"
          echo "Frontend E2E          : ${{ needs.frontend-e2e.result }}"
          echo "Backend Lint          : ${{ needs.backend-lint.result }}"
          echo "Backend Tests         : ${{ needs.backend-test.result }}"
          echo "Backend Security      : ${{ needs.backend-security.result }}"
          echo ""
          echo "Critical jobs (build + backend tests) must be green to merge."
